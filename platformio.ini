; PlatformIO Project Configuration File
;
[env:esp32-s3-devkitc1-n16r8]
; Arduino Release v3.3.12 based on ESP-IDF v5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
extra_scripts = pre:scripts/platformio_extra.py
;upload_protocol = espota

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.extra_flags = 
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
  -DBOARD_HAS_PSRAM

build_flags =
    -std=gnu++2a
    -fno-exceptions
    -Wall
    -Wextra
    -O2  ; gyorsabb futás, kisebb bináris.
    -fdiagnostics-color=always
    -DCORE_DEBUG_LEVEL=3  
    -std=gnu++20

build_unflags = -std=gnu++11  ; Eltávolítja az alapértelmezett C++11 beállítást

board_build.f_cpu = 240000000L

board_build.filesystem = spiffs
lib_ignore = 
    SD
lib_deps = 
    adafruit/Adafruit GFX Library@^1.12.3
    adafruit/Adafruit ILI9341@^1.6.2
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306                  ; тут освобождаем от ';' нужный вам дисплей, ненужный наоборот
    adafruit/Adafruit SH110X
    adafruit/Adafruit ILI9341
    adafruit/Adafruit ST7735 and ST7789 Library

; Soros monitor
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

[env:yoradio-esp32s3n16r8-ST7789]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
extra_scripts = pre:scripts/platformio_extra.py
lib_ignore =
    SD

build_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -std=gnu++2a
    -fno-exceptions
    -Wall
    -Wextra
    -O2  
    -fdiagnostics-color=always
    -DCORE_DEBUG_LEVEL=3

build_unflags = -std=gnu++11

; CPU frekvencia fixálás
board_build.f_cpu = 240000000L

; ---- НАСТРОЙКА ПАМЯТИ ПОД ESP32-S3-N16R8 (16MB Flash / 8MB Octal PSRAM) ----
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi      ; Переключено на OPI (Octal SPI для 8MB PSRAM)
board_upload.flash_size = 16MB                 ; Объем Flash увеличен до 16МБ

; ---- ТАБЛИЦА РАЗДЕЛОВ ДЛЯ ПЛАТ 16MB (ВСТРОЕННАЯ, БЕЗ ВНЕШНИХ CSV) ----
board_build.partitions = default_16MB.csv      ; Создает огромные разделы по 4.5МБ под код (App)
board_build.filesystem = spiffs

; Библиотеки
lib_deps = 
    adafruit/Adafruit GFX Library@^1.12.3
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit NeoPixel

; ---- Monitor / Upload ----
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

upload_speed = 460800
upload_resetmethod = nodemcu
upload_protocol = esptool
board_upload.before_reset = default_reset
board_upload.after_reset = hard_reset

upload_flags =
    --before=default_reset
    --after=hard_reset
    --no-stub



[env:yoradio-ESP32-S3-ZERO]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
;board = waveshare_esp32_s3_zero
framework = arduino
extra_scripts = pre:scripts/platformio_extra.py



build_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -std=gnu++2a
    -fno-exceptions
    -Wall
    -Wextra
    -O2  
    -fdiagnostics-color=always
    -DCORE_DEBUG_LEVEL=3

build_unflags = -std=gnu++11

; CPU frekvencia fixálás
board_build.f_cpu = 240000000L

; ---- НАСТРОЙКА ПАМЯТИ ПОД ESP32-S3-ZERO (4MB/2MB) ----
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi      ; QSPI Flash + QSPI PSRAM (2MB)
board_build.psram_type = qio
board_upload.flash_size = 4MB                   

; ---- ТАБЛИЦА РАЗДЕЛОВ (ИСПРАВЛЕНО ДЛЯ КРУПНЫХ ПРОЕКТОВ 4MB) ----
board_build.partitions = huge_app.csv           ; Выделяет 3МБ под код (вместо 1.3МБ)
board_build.filesystem = spiffs
lib_ignore =
    SD

; Библиотеки (оставляем ваши без изменений)
lib_deps = 
    adafruit/Adafruit GFX Library@^1.12.3
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit NeoPixel

; ---- Monitor / Upload ----
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

upload_speed = 460800
upload_resetmethod = nodemcu
upload_protocol = esptool
board_upload.before_reset = default_reset
board_upload.after_reset = hard_reset

upload_flags =
    --before=default_reset
    --after=hard_reset
    --no-stub